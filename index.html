*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F4F6FA;min-height:100vh;color:#111}
.wrap{max-width:700px;margin:0 auto;padding:32px 16px 48px}
.header{margin-bottom:32px}
.header h1{font-size:22px;font-weight:700;color:#111;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
.accent-bar{width:5px;height:30px;background:#1A56C4;border-radius:3px;flex-shrink:0}
.header p{font-size:13px;color:#666;margin-top:6px;padding-left:15px}
.steps{display:flex;align-items:flex-start;margin-bottom:28px}
.step-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
.step-connector{flex:1;height:2px;margin-bottom:22px;background:#DDE1EC;transition:background .3s}
.step-connector.done{background:#1A56C4}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;background:#EEF0F7;border:2px solid #DDE1EC;color:#999;transition:all .2s}
.step-dot.active{background:#1A56C4;border-color:#1A56C4;color:#fff}
.step-dot.done{background:#1A56C4;border-color:#1A56C4;color:#fff}
.step-label{font-size:11px;color:#aaa;text-align:center}
.step-label.active{color:#1A56C4;font-weight:600}
.step-label.done{color:#555}
.card{background:#fff;border-radius:14px;box-shadow:0 1px 4px rgba(0,0,0,.07),0 4px 20px rgba(0,0,0,.05);padding:28px}
.card h2{font-size:16px;font-weight:600;color:#111;margin-bottom:20px}
.field-label{display:block;font-size:13px;font-weight:600;color:#333;margin-bottom:8px}
.hint{font-size:12px;color:#999;margin:-4px 0 10px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{padding:7px 16px;border-radius:24px;font-size:13px;cursor:pointer;border:2px solid #DDE1EC;background:#F4F6FA;color:#555;transition:all .12s;user-select:none}
.chip:hover{border-color:#aac0f0;background:#EEF3FD}
.chip.selected{border-color:#1A56C4;background:#EEF3FD;color:#1A56C4;font-weight:600}
